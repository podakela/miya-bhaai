<html lang="en">
<head>

<title>Miya Bhai — The Righteous Fighter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #09090f; color: #f8fafc;
    font-family: Consolas, 'Courier New', monospace;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { width: 100vw; height: 100vh; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  .touch { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: none; }
  .touch.on { display: block; }
  .pad {
    position: absolute; bottom: 16px; left: 16px;
    display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px);
    gap: 6px; pointer-events: auto; opacity: 0.85;
  }
  .btn {
    display: grid; place-items: center;
    background: rgba(12,8,22,0.72); color: #fff3c4;
    border: 2px solid rgba(255,255,255,0.45); border-radius: 12px;
    font: 700 12px/1 Consolas, monospace;
    -webkit-user-select: none;
    transition: transform 60ms, background 60ms;
  }
  .btn.pressed { transform: scale(0.9); background: rgba(250,159,50,0.85); color: #2b1206; }
  .pad .up { grid-area: 1/2; }
  .pad .left { grid-area: 2/1; }
  .pad .down { grid-area: 3/2; }
  .pad .right { grid-area: 2/3; }

  .actions {
    position: absolute; bottom: 16px; right: 16px;
    display: grid; grid-template-columns: repeat(2, 68px); grid-template-rows: 68px 68px;
    gap: 8px; pointer-events: auto; opacity: 0.85;
  }
  .actions .btn { border-radius: 50%; font-size: 11px; }
  .actions .special { grid-column: 1 / 3; border-radius: 14px; font-size: 13px; }
</style>
</head>

<div id="game"></div>
<div class="touch" id="touch">

  <div class="actions">

// ============ SOUND ============
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(type, f, fe, dur, gain, delay){
  try{ const c=ac(); const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(fe!==undefined) o.frequency.exponentialRampToValueAtTime(Math.max(1,fe),t0+dur);
    g.gain.setValueAtTime(gain||0.18,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function noise(dur, gain, filt){
  try{ const c=ac(); const t0=c.currentTime;
    const b=c.createBuffer(1, Math.max(1,Math.floor(c.sampleRate*dur)), c.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filt||1200;
    const g=c.createGain(); g.gain.setValueAtTime(gain||0.25,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t0); s.stop(t0+dur+0.03);
  }catch(e){}
}

function limb(g, color, w, a, b){
  g.lineStyle(w, color, 1);
  g.lineBetween(a[0],a[1],b[0],b[1]);
  g.fillStyle(color,1);
  g.fillCircle(a[0],a[1],w/2);
  g.fillCircle(b[0],b[1],w/2);
}
function joint(g,color,w,p,a,b){ limb(g,color,w,p,a); limb(g,color,w,a,b); }
function box(g,color,x,y,w,h){ g.fillStyle(color,1); g.fillRect(x,y,w,h); }

function drawFighter(g, cfg, poseName){
  const p = POSES[poseName] || POSES.idle;
  const c = cfg.colors;
  const w = cfg.build==='huge'||cfg.build==='demon'?14 : cfg.build==='fat'?13 : 11;
  const legW = cfg.build==='huge'||cfg.build==='demon'?18 : cfg.build==='fat'?20 : 15;

  // Cape (behind)
  if(cfg.hasCape && c.cape){
    g.fillStyle(c.cape, 0.95);
    g.fillTriangle(p.shoulder[0]-22, p.shoulder[1]-4, p.shoulder[0]+22, p.shoulder[1]-4, p.shoulder[0], p.hip[1]+30);
  }
  // Back arm + back leg
  joint(g, c.skin, w, p.shoulder, p.eB, p.hB);
  joint(g, c.pants, legW, p.hip, p.kB, p.fB);
  g.fillStyle(c.shoes,1); g.fillEllipse(p.fB[0]+4, p.fB[1]-3, 22, 10);

  // Torso
  const halfW = p.torsoW/2;
  const topY = p.shoulder[1]-6;
  const botY = p.hip[1]+8;
  box(g, c.shirt, p.shoulder[0]-halfW, topY, p.torsoW, botY-topY);
  box(g, c.shirtTrim, p.shoulder[0]-halfW, topY, p.torsoW, 4);
  box(g, c.shirtTrim, p.shoulder[0]-halfW, botY-4, p.torsoW, 4);
  g.fillStyle(0x000000, 0.12); g.fillRect(p.shoulder[0]-halfW, topY, 5, botY-topY);

  // Front leg
  joint(g, c.pants, legW, p.hip, p.kF, p.fF);
  g.fillStyle(c.shoes,1); g.fillEllipse(p.fF[0]+4, p.fF[1]-3, 22, 10);

  // Head
  const hx=p.head[0], hy=p.head[1];
  g.fillStyle(c.skin,1); g.fillCircle(hx,hy,17);
  box(g, c.skin, hx-6, hy+12, 12, 12);
  if(cfg.hasBeard){
    g.fillStyle(c.beard,1); g.fillEllipse(hx, hy+14, 30, 22);
    g.fillStyle(c.skin,1); g.fillEllipse(hx, hy+2, 32, 18);
  }
  if(cfg.hasMoustache){ g.fillStyle(c.hair,1); g.fillRect(hx-12, hy+4, 24, 5); }
  g.fillStyle(0xffffff,1); g.fillCircle(hx-6, hy-2, 3); g.fillCircle(hx+6, hy-2, 3);
  g.fillStyle(0x111111,1); g.fillCircle(hx-5, hy-2, 1.5); g.fillCircle(hx+7, hy-2, 1.5);
  g.fillStyle(c.hair,1); g.fillEllipse(hx, hy-12, 34, 18);

  // Headwear
  const hw = cfg.headwear;
  if(hw==='cap'){
    g.fillStyle(c.headwearColor||0xffffff,1); g.fillEllipse(hx, hy-14, 36, 18);
    g.fillRect(hx, hy-16, 30, 5);
    g.fillStyle(0xdddddd,1); g.fillRect(hx-18, hy-10, 36, 3);
  } else if(hw==='crown'){
    g.fillStyle(c.headwearColor||0xfbbf24,1); g.fillRect(hx-18, hy-22, 36, 8);
    g.fillTriangle(hx-18,hy-22, hx-12,hy-34, hx-6,hy-22);
    g.fillTriangle(hx-4,hy-22, hx+2,hy-36, hx+8,hy-22);
    g.fillTriangle(hx+10,hy-22, hx+16,hy-32, hx+22,hy-22);
  } else if(hw==='turban'){
    g.fillStyle(c.headwearColor||0x1a1a1a,1); g.fillEllipse(hx, hy-16, 42, 24);
    g.fillStyle(c.accent,1); g.fillRect(hx-6, hy-28, 12, 6); g.fillCircle(hx, hy-26, 5);
  } else if(hw==='pharaoh'){
    g.fillStyle(c.headwearColor||0x1e40af,1); g.fillEllipse(hx, hy-18, 46, 24);
    g.fillRect(hx-22, hy-20, 44, 18);
    g.fillStyle(0xfbbf24,1);
    for(let i=-20;i<=20;i+=8) g.fillRect(hx+i, hy-20, 3, 18);
    g.fillRect(hx-2, hy-26, 6, 8); g.fillCircle(hx+2, hy-26, 3);
  } else if(hw==='horns'){
    g.fillStyle(0x1a0000,1);
    g.fillTriangle(hx-20,hy-10, hx-30,hy-40, hx-8,hy-18);
    g.fillTriangle(hx+20,hy-10, hx+30,hy-40, hx+8,hy-18);
    g.fillStyle(c.accent,1); g.fillCircle(hx-6, hy-2, 3); g.fillCircle(hx+6, hy-2, 3);
  }

  // Front arm
  joint(g, c.skin, w, p.shoulder, p.eF, p.hF);
  g.fillCircle(p.hF[0], p.hF[1], w*0.75);

  // Weapon
  if(cfg.weapon==='sword'){
    g.lineStyle(4, 0xcfd8dc, 1); g.lineBetween(p.hF[0], p.hF[1], p.hF[0]+32, p.hF[1]-26);
    g.lineStyle(6, 0x6b4423, 1); g.lineBetween(p.hF[0]-4, p.hF[1]+2, p.hF[0], p.hF[1]);
  } else if(cfg.weapon==='staff'){
    g.lineStyle(4, 0x8b5a1a, 1); g.lineBetween(p.hF[0], p.hF[1]-20, p.hF[0], p.hF[1]+40);
    g.fillStyle(c.accent,1); g.fillCircle(p.hF[0], p.hF[1]-22, 7);
  } else if(cfg.weapon==='scepter'){
    g.lineStyle(5, 0x78350f, 1); g.lineBetween(p.hF[0], p.hF[1]-20, p.hF[0]+6, p.hF[1]+30);
    g.fillStyle(c.accent,1); g.fillCircle(p.hF[0], p.hF[1]-22, 9);
  } else if(cfg.weapon==='rings'){
    g.lineStyle(3, 0xfde68a, 1); g.strokeCircle(p.hF[0], p.hF[1], 8); g.strokeCircle(p.hF[0]+6, p.hF[1]+4, 6);
  }
}

const SPRITE_KEYS = ['idle','walk1','walk2','punch','kick','hit','special'];
function buildFighterTextures(scene, cfg){
  for(const k of SPRITE_KEYS){
    const key = 'f-'+cfg.id+'-'+k;
    if(scene.textures.exists(key)) continue;
    const g = scene.make.graphics({x:0,y:0});
    drawFighter(g, cfg, k);
    g.generateTexture(key, SPR_W, SPR_H);
    g.destroy();
  }
}
function tex(cfg, pose){ return 'f-'+cfg.id+'-'+pose; }

// ============ TOUCH CONTROLS ============
const TOUCH = { left:false, right:false, up:false, down:false, punch:false, kick:false, special:false };
const touchEl = document.getElementById('touch');
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if(isTouch) touchEl.classList.add('on');

document.querySelectorAll('.btn').forEach(el=>{
  const k = el.dataset.k;
  const press = (v)=>{
    TOUCH[k] = v;
    el.classList.toggle('pressed', v);
  };
  el.addEventListener('touchstart', e=>{ e.preventDefault(); press(true); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); press(false); }, {passive:false});
  el.addEventListener('touchcancel', ()=> press(false));
  el.addEventListener('mousedown', ()=> press(true));
  el.addEventListener('mouseup', ()=> press(false));
  el.addEventListener('mouseleave', ()=> press(false));
});

// ============ FIGHTER CLASS ============
class Fighter {
  constructor(scene, cfg, x, facing, isPlayer){
    this.cfg = cfg; this.isPlayer = isPlayer;
    this.x = x; this.y = GROUND_Y; this.vx=0; this.vy=0;
    this.facing = facing; this.hp = cfg.hp; this.maxHp = cfg.hp;
    this.state = 'idle'; this.stateTime = 0; this.attackHasHit = false;
    this.meter = 0; this.onGround = true; this.walkFrame = 0;
    this.sprite = scene.add.sprite(x, GROUND_Y, tex(cfg, 'idle'));
    this.sprite.setOrigin(0.5, 1);
    this.sprite.setFlipX(facing === -1);
  }
  setPose(p){ this.sprite.setTexture(tex(this.cfg, p)); }
  hurt(d){
    if(this.state === 'ko') return;
    this.hp = Math.max(0, this.hp - d);
    this.state = 'hit'; this.stateTime = 0; this.setPose('hit');
    if(this.hp <= 0){ this.state = 'ko'; this.stateTime = 0; }
  }
  reset(x, facing){
    this.hp = this.maxHp; this.meter = 0; this.state='idle'; this.stateTime=0;
    this.attackHasHit = false; this.x = x; this.y = GROUND_Y; this.vx=0; this.vy=0;
    this.facing = facing; this.onGround = true;
    this.sprite.setPosition(x, GROUND_Y); this.sprite.setAngle(0);
    this.sprite.setFlipX(facing === -1); this.setPose('idle');
  }
  isAttacking(){ return this.state==='punch' || this.state==='kick' || this.state==='special'; }
  currentAttack(){ return this.state==='punch'?ATTACKS.punch : this.state==='kick'?ATTACKS.kick : this.state==='special'?ATTACKS.special : null; }
  isActive(){ const a = this.currentAttack(); if(!a) return false; return this.stateTime>=a.startup && this.stateTime<a.startup+a.active; }
}

let hitStop = 0;

// ============ PROJECTILES ============
function makePulseTexture(scene, key, color, glow){
  if(scene.textures.exists(key)) return;
  const g = scene.make.graphics({x:0,y:0});
  g.fillStyle(glow, 0.55); g.fillCircle(32,32,30);
  g.fillStyle(color, 1); g.fillCircle(32,32,18);
  g.fillStyle(0xffffff, 0.9); g.fillCircle(32,32,8);
  g.generateTexture(key, 64, 64);
  g.destroy();
}
function spawnProj(scene, x, y, facing, color, glow, owner, dmg, speed){
  const core = scene.add.circle(0,0,16,color,1);
  const gl = scene.add.circle(0,0,28,glow,0.5);
  const sp = scene.add.circle(0,0,6,0xffffff,0.95);
  const c = scene.add.container(x,y,[gl,core,sp]).setDepth(300);
  const trail = scene.add.particles(0,0,'__WHITE',{
    follow:c, speed:{min:20,max:80}, lifespan:240, scale:{start:0.9,end:0},
    quantity:2, frequency:30, tint:[color,glow,0xffffff], blendMode:'ADD'
  }).setDepth(299);
  return { c, core, gl, vx: facing*speed, owner, dmg, life:1600, dead:false, trail };
}
function killProj(p){
  if(p.dead) return;
  p.dead = true;
  p.trail.stop();
  setTimeout(()=>p.trail.destroy(), 500);
  p.c.scene.tweens.add({ targets:p.c, scale:1.8, alpha:0, duration:160, onComplete:()=>p.c.destroy() });
}

}
SelectScene.unlockNext = function(currentIndex){
  const next = Math.min(currentIndex + 1, VILLAINS.length - 1);
  const prev = loadProgress();
  if(next > prev) localStorage.setItem(PROGRESS_KEY, String(next));
};

      g.fillStyle(0x8b5a1a,1); g.fillTriangle(120,GROUND_Y,320,GROUND_Y-260,520,GROUND_Y);

      for(let i=0;i<6;i++){
        const w = 120+i*90, h = 42, y = GROUND_Y - (i+1)*h;

  showBanner(text, dur){

  startIntro(){
    this.phase = 'intro'; this.phaseTime = 0;
    this.player.y = GROUND_Y - 300; this.enemy.y = GROUND_Y - 300;
    this.player.sprite.setAlpha(0); this.enemy.sprite.setAlpha(0);

    this.tweens.add({ targets:this.enemy.sprite, y:GROUND_Y, alpha:1, duration:450, delay:90, ease:'Bounce.easeOut',
      onComplete: ()=>{ SFX.land(); this.cameras.main.shake(80,0.004); } });

    const top = this.add.rectangle(0,-80,W,80,0x000000,0.85).setOrigin(0,0).setDepth(700);
    const bot = this.add.rectangle(0,H,W,80,0x000000,0.85).setOrigin(0,0).setDepth(700);
    this.tweens.add({ targets:top, y:0, duration:300, yoyo:true, hold:700, onComplete:()=>top.destroy() });
    this.tweens.add({ targets:bot, y:H-80, duration:300, yoyo:true, hold:700, onComplete:()=>bot.destroy() });

    this.showBanner(this.enemy.cfg.name, 900);
    SFX.round();
    this.time.delayedCall(950, ()=>{
      this.showBanner(this.roundNumber===1 ? 'FIGHT!' : 'ROUND '+this.roundNumber, 600);
      SFX.fight();
      this.time.delayedCall(600, ()=>this.beginRound());
    });
  }

  beginRound(){ this.phase = 'fight'; this.phaseTime = 0; this.roundTime = ROUND_TIME; }

  endRound(playerWon){
    if(this.phase === 'roundEnd' || this.phase === 'matchEnd') return;
    this.phase = 'roundEnd'; this.phaseTime = 0;
    if(playerWon) this.playerRounds++; else this.enemyRounds++;

    const winner = playerWon ? this.player : this.enemy;
    const loser = playerWon ? this.enemy : this.player;

    this.cameras.main.zoomTo(1.2, 500, 'Sine.easeInOut');
    this.cameras.main.pan((loser.x+winner.x)/2, 380, 500, 'Sine.easeInOut');

    this.tweens.add({ targets:winner.sprite, scaleX:1.08, scaleY:1.08, duration:200, yoyo:true, repeat:2 });

    loser.state = 'ko'; loser.setPose('hit');
    this.tweens.add({ targets:loser.sprite, angle:loser.facing===1?-85:85, y:GROUND_Y-30, duration:550,
      ease:'Cubic.easeIn', onComplete: ()=>{ SFX.land(); this.cameras.main.shake(260,0.012); SFX.ko(); } });

    this.flash.setFillStyle(0xff0000, 0.55);
    this.tweens.add({ targets:this.flash, alpha:0, duration:380 });

    const over = this.playerRounds >= ROUNDS_TO_WIN || this.enemyRounds >= ROUNDS_TO_WIN;
    if(over){
      this.time.delayedCall(650, ()=> playerWon ? SFX.victory() : SFX.defeat());
      this.showBanner(playerWon ? 'K.O.!' : 'YOU LOSE', 1400);
      this.time.delayedCall(2000, ()=>this.endMatch(playerWon));
    } else {
      this.showBanner(playerWon ? 'ROUND WON!' : 'ROUND LOST', 1400);
      this.time.delayedCall(2200, ()=>this.nextRound());
    }
  }

  nextRound(){
    this.roundNumber++;
    this.player.reset(260, 1);
    this.enemy.reset(700, -1);
    this.projs.forEach(killProj); this.projs = [];
    this.cameras.main.zoomTo(1, 400, 'Sine.easeInOut');
    this.cameras.main.pan(W/2, H/2, 400, 'Sine.easeInOut');
    this.time.delayedCall(400, ()=>{
      this.showBanner('ROUND '+this.roundNumber, 800);
      SFX.round();
      this.time.delayedCall(900, ()=>{
        this.showBanner('FIGHT!', 600); SFX.fight();
        this.beginRound();
      });
    });
  }

  endMatch(playerWon){
    this.phase = 'matchEnd'; this.phaseTime = 0;
    const isFinal = this.villainIndex === VILLAINS.length - 1;
    if(playerWon){
      SelectScene.unlockNext(this.villainIndex);
      this.showBanner(isFinal ? 'MIYA BHAI IS VICTORIOUS!\nALL VILLAINS DEFEATED' : 'MATCH WON!\nTAP TO CONTINUE', 4000);
    } else {
      this.showBanner('MATCH LOST\nTAP TO RETRY', 4000);
    }
    // Tap anywhere to continue
    this.input.once('pointerdown', ()=>this.continueAfterMatch(playerWon));
    this.input.keyboard.once('keydown-ENTER', ()=>this.continueAfterMatch(playerWon));
  }

  continueAfterMatch(playerWon){
    if(playerWon){
      const next = this.villainIndex + 1;
      if(next < VILLAINS.length) this.scene.start('Fight', { villainIndex: next });
      else this.scene.start('Select');
    } else {
      this.scene.start('Fight', { villainIndex: this.villainIndex });
    }
  }

  update(time, delta){
    const dt = delta/1000;
    this.phaseTime += delta;

    if(hitStop > 0){ hitStop -= delta; this.drawHUD(); return; }

    if(this.phase === 'fight'){
      this.updatePlayer(dt);
      this.updateEnemy(dt);
      this.updatePhysics(this.player, dt);
      this.updatePhysics(this.enemy, dt);
      this.resolveFacing();
      this.checkHits();
      this.regenMeter(dt);
      this.updateProjectiles(dt);
      this.roundTime -= dt;
      if(this.roundTime <= 0){ this.roundTime = 0; this.endRound(this.player.hp >= this.enemy.hp); }
      if(this.player.hp <= 0) this.endRound(false);
      else if(this.enemy.hp <= 0) this.endRound(true);
    } else if(this.phase === 'roundEnd' || this.phase === 'matchEnd'){
      this.updatePhysics(this.player, dt);
      this.updatePhysics(this.enemy, dt);
    } else if(this.phase === 'intro' && this.phaseTime > 2300){
      if(this.phase !== 'fight') this.beginRound();
    }

    this.drawHUD();
  }

  updatePlayer(dt){
    const p = this.player;
    if(p.state === 'ko' || p.state === 'hit'){
      p.stateTime += dt*1000;
      if(p.state === 'hit' && p.stateTime > 250){ p.state='idle'; p.stateTime=0; p.setPose('idle'); }
      return;
    }
    const left = this.cursors.left.isDown || this.keys.A.isDown || TOUCH.left;
    const right = this.cursors.right.isDown || this.keys.D.isDown || TOUCH.right;
    const jump = Phaser.Input.Keyboard.JustDown(this.keys.W) || Phaser.Input.Keyboard.JustDown(this.keys.SPACE) || TOUCH.up;
    const crouch = this.cursors.down.isDown || this.keys.S.isDown || TOUCH.down;
    const punch = Phaser.Input.Keyboard.JustDown(this.keys.J) || TOUCH.punch;
    const kick = Phaser.Input.Keyboard.JustDown(this.keys.K) || TOUCH.kick;
    const special = Phaser.Input.Keyboard.JustDown(this.keys.L) || TOUCH.special;
    TOUCH.up=false; TOUCH.punch=false; TOUCH.kick=false; TOUCH.special=false;

    if(p.isAttacking()){
      p.stateTime += dt*1000;
      const a = p.currentAttack(); const total = a.startup+a.active+a.recovery;
      if(p.stateTime >= total){ p.state='idle'; p.stateTime=0; p.attackHasHit=false; p.setPose('idle'); }
      return;
    }
    if(special && p.meter >= 50){
      p.meter -= 50; p.state='special'; p.stateTime=0; p.attackHasHit=false; p.setPose('special');
      SFX.special();
      this.time.delayedCall(160, ()=>{
        if(p.state !== 'special') return;
        this.projs.push(spawnProj(this, p.x + p.facing*40, p.y-90, p.facing,
          MIYA.specialColor, MIYA.specialGlow, 'player', 14, 700));
      });
      return;
    }
    if(punch){ p.state='punch'; p.stateTime=0; p.attackHasHit=false; p.setPose('punch'); SFX.punch(); return; }
    if(kick){ p.state='kick'; p.stateTime=0; p.attackHasHit=false; p.setPose('kick'); SFX.kick(); return; }
    if(jump && p.onGround){ p.vy = p.cfg.jumpVel; p.onGround = false; SFX.jump(); return; }
    if(crouch && p.onGround){ p.state='crouch'; p.vx=0; return; }

    if(left && !right){ p.vx = -p.cfg.speed; p.state='walk'; p.walkFrame += dt*8; }
    else if(right && !left){ p.vx = p.cfg.speed; p.state='walk'; p.walkFrame += dt*8; }
    else { p.vx = 0; p.state='idle'; }

    if(!p.onGround) p.setPose('idle');
    else if(p.state === 'walk') p.setPose(Math.floor(p.walkFrame)%2===0 ? 'walk1' : 'walk2');
    else p.setPose('idle');
  }

  updateEnemy(dt){
    const e = this.enemy, p = this.player;
    if(e.state === 'ko' || e.state === 'hit'){
      e.stateTime += dt*1000;
      if(e.state === 'hit' && e.stateTime > 220){ e.state='idle'; e.stateTime=0; e.setPose('idle'); }
      return;
    }
    if(e.isAttacking()){
      e.stateTime += dt*1000;
      const a = e.currentAttack(); const total = a.startup+a.active+a.recovery;
      if(e.stateTime >= total){ e.state='idle'; e.stateTime=0; e.attackHasHit=false; e.setPose('idle'); }
      return;
    }

    this.enemyCooldown -= dt*1000;
    if(this.enemyCooldown > 0){ e.vx=0; e.state='idle'; e.setPose('idle'); return; }

    this.enemyThink -= dt*1000;
    if(this.enemyThink <= 0){
      const dist = Math.abs(p.x - e.x);
      const r = Math.random();
      const windingUp = p.isAttacking() && p.stateTime < 300;

      if(windingUp && dist < 150 && r < 0.55){ this.enemyIntent='retreat'; this.enemyThink = 220; }
      else if(dist > 240){ this.enemyIntent='approach'; this.enemyThink = 240 + Math.random()*200; }
      else if(dist < 90){
        this.enemyIntent = r < 0.5 ? 'punch' : r < 0.85 ? 'kick' : 'retreat';
        this.enemyThink = 240 + Math.random()*200;
      } else {
        this.enemyIntent = r < 0.35 ? 'approach' : r < 0.65 ? 'punch' : r < 0.9 ? 'kick' : 'wait';
        this.enemyThink = 300 + Math.random()*240;
      }

      if(e.cfg.isBoss && dist > 260 && dist < 520 && Math.random() < 0.4){
        this.enemyFireProjectile();
        this.enemyThink = 900; this.enemyCooldown = 400;
      }
    }

    if(this.enemyIntent === 'approach'){
      e.vx = (p.x > e.x ? 1 : -1) * e.cfg.speed;
      e.state='walk'; e.walkFrame += dt*8;
      e.setPose(Math.floor(e.walkFrame)%2===0 ? 'walk1' : 'walk2');
    } else if(this.enemyIntent === 'retreat'){
      e.vx = (p.x > e.x ? -1 : 1) * e.cfg.speed * 0.7;
      e.state='walk'; e.walkFrame += dt*8;
      e.setPose(Math.floor(e.walkFrame)%2===0 ? 'walk1' : 'walk2');
    } else if(this.enemyIntent === 'punch'){
      e.vx=0; e.state='punch'; e.stateTime=0; e.attackHasHit=false; e.setPose('punch');
      SFX.punch(); this.enemyCooldown = 160;
    } else if(this.enemyIntent === 'kick'){
      e.vx=0; e.state='kick'; e.stateTime=0; e.attackHasHit=false; e.setPose('kick');
      SFX.kick(); this.enemyCooldown = 220;
    } else {
      e.vx=0; e.state='idle'; e.setPose('idle');
    }
  }

  enemyFireProjectile(){
    const e = this.enemy;
    e.state='special'; e.stateTime=0; e.attackHasHit=false; e.setPose('special');
    SFX.special();
    this.time.delayedCall(180, ()=>{
      if(e.state !== 'special') return;
      this.projs.push(spawnProj(this, e.x + e.facing*40, e.y-90, e.facing,
        e.cfg.specialColor, e.cfg.specialGlow, 'enemy', 12, 620));
    });
  }

  updatePhysics(f, dt){
    f.vy += 1900 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if(f.y >= GROUND_Y){ f.y = GROUND_Y; f.vy = 0; f.onGround = true; }
    f.x = Phaser.Math.Clamp(f.x, FLOOR_MIN, FLOOR_MAX);
    f.sprite.setPosition(f.x, f.y);
  }

  resolveFacing(){
    const p = this.player, e = this.enemy;
    const pf = e.x >= p.x ? 1 : -1;
    const ef = p.x >= e.x ? 1 : -1;
    if(p.facing !== pf){ p.facing = pf; p.sprite.setFlipX(pf === -1); }
    if(e.facing !== ef){ e.facing = ef; e.sprite.setFlipX(ef === -1); }
  }

  checkHits(){ this.tryHit(this.player, this.enemy); this.tryHit(this.enemy, this.player); }

  tryHit(a, d){
    if(!a.isActive() || a.attackHasHit) return;
    if(d.state === 'ko') return;
    const atk = a.currentAttack();
    const dx = (d.x - a.x) * a.facing;
    const dy = a.y - d.y;
    if(dx < 0 || dx > atk.reach) return;
    if(Math.abs(dy) > atk.height) return;

    a.attackHasHit = true;
    const dmg = Math.round(atk.damage * a.cfg.power);
    d.hurt(dmg);
    a.meter = Math.min(100, a.meter + 6);
    d.meter = Math.min(100, d.meter + 3);

    this.particles.setPosition(d.x, d.y - 80);
    this.particles.explode(12);
    this.cameras.main.shake(120, 0.006);
    SFX.hit();
    const imp = this.add.rectangle(d.x, d.y-80, 70, 70, 0xffffff, 0.85).setDepth(450);
    this.tweens.add({ targets:imp, alpha:0, scale:1.6, duration:180, onComplete:()=>imp.destroy() });

    hitStop = a.state === 'kick' ? 110 : a.state === 'special' ? 150 : 70;
  }

  updateProjectiles(dt){
    for(const p of this.projs){
      if(p.dead) continue;
      p.c.x += p.vx * dt;
      p.life -= dt*1000;
      p.gl.setScale(1 + Math.sin(this.time.now*0.02)*0.12);
      if(p.life <= 0 || p.c.x < -60 || p.c.x > W+60){ killProj(p); continue; }
      const t = p.owner === 'player' ? this.enemy : this.player;
      if(t.state === 'ko') continue;
      const dx = Math.abs(p.c.x - t.x);
      const dy = Math.abs(p.c.y - (t.y - 90));
      if(dx < 50 && dy < 110){
        t.hurt(p.dmg);
        SFX.projHit();
        hitStop = 120;
        this.cameras.main.shake(180, 0.009);
        this.particles.setPosition(p.c.x, p.c.y);
        this.particles.explode(20);
        const fl = this.add.rectangle(p.c.x, p.c.y, 120, 120, 0xffffff, 0.9).setDepth(450);
        this.tweens.add({ targets:fl, alpha:0, scale:2, duration:240, onComplete:()=>fl.destroy() });
        killProj(p);
      }
    }
    this.projs = this.projs.filter(p => !p.dead);
  }

  regenMeter(dt){
    this.player.meter = Math.min(100, this.player.meter + dt*4);
    this.enemy.meter = Math.min(100, this.enemy.meter + dt*3);
  }

  drawHUD(){
    const g = this.hudG; g.clear();
    const barW = 360, barH = 22, y = 22;

    // Player HP
    g.fillStyle(0x000000, 0.65); g.fillRect(20, y, barW, barH);
    g.fillStyle(0x22c55e, 1); g.fillRect(20, y, barW * (this.player.hp/this.player.maxHp), barH);
    g.lineStyle(2, 0xfff7ad, 1); g.strokeRect(20, y, barW, barH);

    // Player meter
    g.fillStyle(0x000000, 0.65); g.fillRect(20, y+barH+4, barW, 8);
    g.fillStyle(0x60a5fa, 1); g.fillRect(20, y+barH+4, barW * (this.player.meter/100), 8);

    // Enemy HP
    g.fillStyle(0x000000, 0.65); g.fillRect(W-20-barW, y, barW, barH);
    const eW = barW * (this.enemy.hp/this.enemy.maxHp);
    g.fillStyle(0xef4444, 1); g.fillRect(W-20-eW, y, eW, barH);
    g.lineStyle(2, 0xfff7ad, 1); g.strokeRect(W-20-barW, y, barW, barH);
    if(this.enemy.cfg.isBoss){
      g.lineStyle(2, 0xf97316, 1);
      g.strokeRect(W-22-barW, y-2, barW+4, barH+4);
    }

    // Names
    this.pNameText.setText(MIYA.name + '  ' + Math.ceil(this.player.hp) + '/' + this.player.maxHp);
    this.eNameText.setText(Math.ceil(this.enemy.hp) + '/' + this.enemy.maxHp + '  ' + this.enemy.cfg.name);

    // Timer
    this.timerText.setText(Math.max(0, Math.ceil(this.roundTime)).toString());
  }
}

// ============ GAME ============
const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  backgroundColor: '#10172a',
  pixelArt: true,
  roundPixels: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [SelectScene, FightScene]
};

new Phaser.Game(config);
})();
</script>
